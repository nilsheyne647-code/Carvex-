<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CARVEX</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CARVEX"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0A0A0A">
<style>
:root{--bg:#0A0A0A;--card:#161616;--card2:#1f1f1f;--line:#2a2a2a;--or:#FF6A00;--tx:#fff;--mu:#9a9a9a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Inter","Helvetica Neue",Arial,sans-serif;min-height:100%;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.v{padding:18px 16px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:26px;letter-spacing:-.5px}h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mu);margin:22px 0 10px}
.logo{font-weight:800;letter-spacing:4px;font-size:15px}.logo b{color:var(--or)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scanbtn{width:100%;margin:18px 0;padding:22px;border-radius:24px;background:linear-gradient(135deg,#ff8a2a,var(--or));color:#111;font-weight:800;font-size:19px;box-shadow:0 0 40px #ff6a0066;animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 60px #ff6a00aa}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}.stat small{color:var(--mu);display:block;font-size:12px}.stat b{font-size:20px}
.stat b.o{color:var(--or)}
.img{background:#111;aspect-ratio:4/3;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.img img{width:100%;height:100%;display:block;object-fit:cover}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;text-align:left;position:relative;transition:.2s}
.tile:active{transform:scale(.97)}.tile.sel{border-color:var(--or);box-shadow:0 0 20px #ff6a0055}
.tile .img{aspect-ratio:4/3}.tile b{display:block;margin-top:8px;font-size:14px}.tile small{color:var(--mu)}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.hs .tile{min-width:150px}
.star{position:absolute;top:12px;right:12px;font-size:18px;color:var(--or);text-shadow:0 0 6px #000}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:#111e;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);font-size:11px;padding:6px}
nav button.on{color:var(--or)}nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hl{text-align:center;padding:14px 6px;border-radius:18px;background:linear-gradient(160deg,#2a1608,var(--card));border:1px solid #ff6a0055}
.hl b{display:block;font-size:26px;color:var(--or)}.hl small{color:var(--mu);font-size:12px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:12px}.kv:last-child{border:0}.kv span{color:var(--mu)}.kv em{font-style:normal;text-align:right}.kv em.u{color:#777}
.btn{padding:12px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600}.btn.p{background:var(--or);color:#111;border:0}.btn.d{color:#ff5a5a}
.in{font-size:16px;width:100%;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);outline:0}.in:focus{border-color:var(--or)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:#ff6a0026;color:var(--or)}.badge.w{background:#ffcc0022;color:#ffcc33}
.scan{position:relative;overflow:hidden;border-radius:20px;background:#111}.scan img{width:100%;display:block;max-height:380px;object-fit:contain}
.scan:after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--or);box-shadow:0 0 24px 8px #ff6a00aa;animation:ln 1.8s ease-in-out infinite alternate}
.scan.done:after{display:none}@keyframes ln{from{top:0}to{top:calc(100% - 3px)}}
.step{color:var(--mu);margin:14px 0;text-align:center;animation:in .3s}
.hide{display:none!important}.fade{animation:in .5s both}
.cand{width:100%;text-align:left;margin-top:8px}
.err{border-color:#ff5a5a66;color:#ff9a9a}
.hist div{padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<input type="file" id="cam" accept="image/*" capture="environment" class="hide">
<input type="file" id="gal" accept="image/*" class="hide">
<input type="file" id="imp" accept=".json,application/json" class="hide">
<script>
"use strict";
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null?"–":Math.round(n).toLocaleString("de-DE");
const eur=n=>n==null?"unbekannt":fmt(n)+" €";
/* ---------- Einstellungen ---------- */
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const CONFIG={API_URL:""}; /* optional: Worker-URL hier fest eintragen, sonst im Profil einstellen */
const apiUrl=()=>(LS.get("cx_api")||CONFIG.API_URL||"").trim();
/* ---------- Speicher (IndexedDB mit Fallback) ---------- */
const Store=(()=>{let db,mem=[];
 const tx=(m,f)=>new Promise(r=>{if(!db)return r(f(null));try{const t=db.transaction("cars",m),o=f(t.objectStore("cars"));t.oncomplete=()=>r(o&&o.result);t.onerror=()=>r()}catch(e){r()}});
 return{
  open:()=>new Promise(r=>{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();const q=indexedDB.open("carvex",1);q.onupgradeneeded=()=>q.result.createObjectStore("cars",{keyPath:"id"});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}}),
  async all(){if(!db)return mem;return (await tx("readonly",s=>s.getAll()))||[]},
  async put(c){if(!db){mem=mem.filter(x=>x.id!==c.id).concat(c);return}await tx("readwrite",s=>s.put(c))},
  async del(id){if(!db){mem=mem.filter(x=>x.id!==id);return}await tx("readwrite",s=>s.delete(id))}}})();
/* ---------- KI über eigenes Backend (Worker) ---------- */
async function api(body){const u=apiUrl();if(!u)throw new Error("Die KI-Verbindung ist noch nicht eingerichtet. Trage im Profil die Worker-URL ein.");
 let r;try{r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}catch(e){throw new Error("Keine Verbindung zur KI. Prüfe Internet und Worker-URL.")}
 const j=await r.json().catch(()=>null);if(!r.ok||!j||j.error)throw new Error((j&&j.error)||"KI-Fehler ("+r.status+").");return j.data}
const analyze=img=>api({mode:"image",image:img}),byHint=h=>api({mode:"hint",hint:h});
/* ---------- Bild ---------- */
function loadImg(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>j(new Error("Bild konnte nicht gelesen werden."));i.src=src})}
function small(c){const k=Math.min(1,800/Math.max(c.width,c.height)),t=document.createElement("canvas");t.width=c.width*k;t.height=c.height*k;t.getContext("2d").drawImage(c,0,0,t.width,t.height);return t.toDataURL("image/jpeg",.62)}
const readURL=f=>new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=()=>j(new Error("Datei konnte nicht gelesen werden."));x.readAsDataURL(f)});
async function readImg(f){try{return await loadImg(await readURL(f))}catch(e){try{return await createImageBitmap(f)}catch(e2){throw new Error("Bild konnte nicht gelesen werden. Bitte ein JPG oder PNG verwenden.")}}}
async function prep(file){const im=await readImg(file),k=Math.min(1,1024/Math.max(im.width,im.height));
 const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
 return{canvas:c,big:c.toDataURL("image/jpeg",.8),url:small(c)}}
/* Freistellung: Hintergrund per Randfarben-Flutung, weiche Kante, Bodenschatten, dunkler Hintergrund */
function cutout(src,bb){const W=src.width,H=src.height;let[x,y,w,h]=(bb&&bb.length==4?bb:[0,0,1,1]).map(Number);
 const p=.06;x=Math.max(0,x-p);y=Math.max(0,y-p);w=Math.min(1-x,w+2*p);h=Math.min(1-y,h+2*p);
 const sx=x*W,sy=y*H,sw=w*W,sh=h*H,k=Math.min(1,640/sw),cw=Math.round(sw*k),ch=Math.round(sh*k);
 const cv=(a,b)=>{const c=document.createElement("canvas");c.width=a;c.height=b;return c};
 const c=cv(cw,ch),g=c.getContext("2d",{willReadFrequently:true});g.drawImage(src,sx,sy,sw,sh,0,0,cw,ch);
 const a=g.getImageData(0,0,cw,ch).data,bg=new Uint8Array(cw*ch),q=[],edge=[];let mr=0,mg=0,mb=0;
 const dist=(i,j)=>Math.abs(a[i*4]-a[j*4])+Math.abs(a[i*4+1]-a[j*4+1])+Math.abs(a[i*4+2]-a[j*4+2]);
 for(let i=0;i<cw;i++)edge.push(i,(ch-1)*cw+i);for(let j=0;j<ch;j++)edge.push(j*cw,j*cw+cw-1);
 edge.forEach(i=>{mr+=a[i*4];mg+=a[i*4+1];mb+=a[i*4+2]});mr/=edge.length;mg/=edge.length;mb/=edge.length;
 const far=i=>Math.abs(a[i*4]-mr)+Math.abs(a[i*4+1]-mg)+Math.abs(a[i*4+2]-mb)>200;
 edge.forEach(i=>{if(!bg[i]&&!far(i)){bg[i]=1;q.push(i)}});
 while(q.length){const i=q.pop(),X=i%cw,Y=(i/cw)|0;for(const j of[X>0?i-1:-1,X<cw-1?i+1:-1,Y>0?i-cw:-1,Y<ch-1?i+cw:-1]){if(j<0||bg[j])continue;if(dist(i,j)<30&&!far(j)){bg[j]=1;q.push(j)}}}
 const m=cv(cw,ch),mx=m.getContext("2d"),md=mx.createImageData(cw,ch);
 for(let i=0;i<cw*ch;i++){md.data[i*4]=md.data[i*4+1]=md.data[i*4+2]=255;md.data[i*4+3]=bg[i]?0:255}
 mx.putImageData(md,0,0);
 const sm=cv(Math.max(1,cw>>1),Math.max(1,ch>>1));sm.getContext("2d").drawImage(m,0,0,sm.width,sm.height);
 const m2=cv(cw,ch),x2=m2.getContext("2d");x2.imageSmoothingQuality="high";x2.drawImage(sm,0,0,cw,ch);
 const t=cv(cw,ch),tg=t.getContext("2d");tg.drawImage(c,0,0);tg.globalCompositeOperation="destination-in";tg.drawImage(m2,0,0);
 const F=cv(800,600),fg=F.getContext("2d"),gr=fg.createRadialGradient(400,470,20,400,470,520);gr.addColorStop(0,"#3a2312");gr.addColorStop(1,"#101010");fg.fillStyle=gr;fg.fillRect(0,0,800,600);
 const sc=Math.min(720/cw,470/ch),dw=cw*sc,dh=ch*sc,dx=(800-dw)/2,dy=(600-dh)/2+10;
 fg.save();fg.translate(400,dy+dh-4);fg.scale(1,.14);const sh2=fg.createRadialGradient(0,0,5,0,0,dw*.5);sh2.addColorStop(0,"#000d");sh2.addColorStop(1,"#0000");fg.fillStyle=sh2;fg.fillRect(-500,-400,1000,800);fg.restore();
 fg.drawImage(t,dx,dy,dw,dh);return F.toDataURL("image/jpeg",.82)}
/* ---------- State ---------- */
let cars=[],tab="home",detail=null,cmp=[],cmpMode=false,F={q:"",sort:"date",cls:""},scanSt={phase:"idle"};
const nm=c=>`${c.brand||"Unbekannt"} ${c.model||""}`.trim();
const val=c=>c.priceUsed||0,rl=n=>n<=2?"Alltäglich":n<=4?"Verbreitet":n<=6?"Selten":n<=8?"Sehr selten":"Legendär";
/* ---------- Views ---------- */
const IC={home:'<path d="M3 11l9-8 9 8v10H3z"/>',scan:'<path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M4 12h16"/>',garage:'<path d="M3 21V9l9-5 9 5v12M7 21v-7h10v7"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
function nav(){$("#nav").innerHTML=[["home","Home"],["scan","Scannen"],["garage","Garage"],["profile","Profil"]].map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${tab==k&&!detail?"on":""}"><svg viewBox="0 0 24 24">${IC[k]}</svg>${l}</button>`).join("")}
const tile=c=>`<button class="tile ${cmp.includes(c.id)?"sel":""}" data-act="open" data-id="${c.id}">${c.fav?'<span class="star">★</span>':""}<div class="img"><img src="${c.img}" alt=""></div><b>${esc(nm(c))}</b><small>${c.ps?fmt(c.ps)+" PS":"PS unbekannt"}${c.rarity?" · Seltenheit "+c.rarity+"/10":""}</small></button>`;
function home(){const l=cars[0],top=[...cars].sort((a,b)=>(b.ps||0)-(a.ps||0))[0],fast=[...cars].sort((a,b)=>(b.vmax||0)-(a.vmax||0))[0],tot=cars.reduce((s,c)=>s+val(c),0),rare=[...cars].sort((a,b)=>(b.rarity||0)-(a.rarity||0))[0];
 return`<div class="v"><div class="row sp"><span class="logo">CAR<b>VEX</b></span><span class="badge">${cars.length} Autos</span></div>
 <h1 style="margin-top:18px">Hallo 👋<br>Was fährt da vorbei?</h1>
 <button class="scanbtn" data-act="tab" data-v="scan">◎ Auto scannen</button>
 ${l?`<h2>Zuletzt gescannt</h2><button class="card row" style="width:100%;text-align:left" data-act="open" data-id="${l.id}"><div class="img" style="width:120px"><img src="${l.img}" alt=""></div><div><b>${esc(nm(l))}</b><br><small style="color:var(--mu)">${esc(l.gen||"")} ${esc(l.years||"")}</small></div></button>`:`<div class="card" style="color:var(--mu)">Noch keine Autos. Scanne dein erstes Auto, um deine Garage zu starten.</div>`}
 <h2>Garage in Zahlen</h2><div class="g2"><div class="stat"><small>Gescannt</small><b>${cars.length}</b></div><div class="stat"><small>Geschätzter Gesamtwert</small><b class="o">${eur(tot||null)}</b></div>
 <div class="stat"><small>Stärkstes Auto</small><b>${top&&top.ps?esc(nm(top)):"–"}</b><small>${top&&top.ps?fmt(top.ps)+" PS":""}</small></div><div class="stat"><small>Schnellstes Auto</small><b>${fast&&fast.vmax?esc(nm(fast)):"–"}</b><small>${fast&&fast.vmax?fmt(fast.vmax)+" km/h":""}</small></div>
 <div class="stat" style="grid-column:span 2"><small>Seltenstes Auto</small><b class="o">${rare&&rare.rarity?esc(nm(rare))+" · "+rare.rarity+"/10":"–"}</b></div></div>
 ${cars.length?`<h2>Zuletzt entdeckt</h2><div class="hs">${cars.slice(0,8).map(tile).join("")}</div>`:""}</div>`}
function garage(){let L=cars.filter(c=>(nm(c)+" "+(c.cls||"")).toLowerCase().includes(F.q.toLowerCase())&&(!F.cls||c.cls===F.cls));
 L.sort((a,b)=>F.sort=="brand"?nm(a).localeCompare(nm(b)):F.sort=="ps"?(b.ps||0)-(a.ps||0):F.sort=="rarity"?(b.rarity||0)-(a.rarity||0):F.sort=="fav"?(b.fav?1:0)-(a.fav?1:0):b.ts-a.ts);
 const cl=[...new Set(cars.map(c=>c.cls).filter(Boolean))];
 return`<div class="v"><div class="row sp"><h1>Meine Garage</h1><button class="btn ${cmpMode?"p":""}" data-act="cmpmode">${cmpMode?"Abbrechen":"Vergleich"}</button></div>
 <input class="in" id="q" placeholder="Suchen …" value="${esc(F.q)}" style="margin:14px 0 10px"><div class="g2" style="margin-bottom:14px">
 <select class="in" id="so"><option value="date">Neueste</option><option value="brand">Marke</option><option value="ps">Leistung</option><option value="rarity">Seltenheit</option><option value="fav">Favoriten</option></select>
 <select class="in" id="cl"><option value="">Alle Klassen</option>${cl.map(x=>`<option ${F.cls==x?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
 ${cmpMode?`<p class="step">Wähle zwei Autos (${cmp.length}/2)</p>`:""}
 ${L.length?`<div class="tiles">${L.map(tile).join("")}</div>`:`<div class="card" style="color:var(--mu)">${cars.length?"Keine Treffer.":"Deine Garage ist noch leer."}</div>`}
 ${cars.length>1?`<h2>Leistungsranking</h2><div class="card">${[...cars].sort((a,b)=>(b.ps||0)-(a.ps||0)).slice(0,5).map((c,i)=>`<div class="kv"><span>${i+1}. ${esc(nm(c))}</span><em>${c.ps?fmt(c.ps)+" PS":"–"}</em></div>`).join("")}</div>`:""}</div>`}
function profile(){return`<div class="v"><h1>Profil</h1><h2>Übersicht</h2><div class="g2"><div class="stat"><small>Autos</small><b>${cars.length}</b></div><div class="stat"><small>Favoriten</small><b>${cars.filter(c=>c.fav).length}</b></div></div>
 <h2>Scan-Verlauf</h2><div class="card hist">${cars.length?cars.map(c=>`<div><span>${esc(nm(c))}</span><span style="color:var(--mu)">${new Date(c.ts).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})}</span></div>`).join(""):"Noch keine Scans."}</div>
 <h2>Datensicherung</h2><div class="card" style="color:var(--mu);font-size:13px">Deine Garage liegt auf diesem Gerät im Safari-Speicher. Sichere sie regelmäßig mit einer Backup-Datei, zum Beispiel vor iOS-Updates oder bevor du Safari-Daten löschst.</div><div class="row" style="margin-top:10px"><button class="btn" data-act="exp">Backup-Datei speichern</button><button class="btn" data-act="imp">Backup laden</button></div>
 <h2>KI-Verbindung</h2><input class="in" id="api" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://carvex-ai.NAME.workers.dev" value="${esc(apiUrl())}"><h2>Einstellungen</h2><label class="card row" style="cursor:pointer"><input type="checkbox" id="co" ${LS.get("cx_cut")=="1"?"checked":""} style="width:22px;height:22px;accent-color:#FF6A00"><span>Auto beim Scan freistellen (experimentell)</span></label>
 <h2>Hinweise</h2><div class="card" style="color:var(--mu);font-size:13px">Erkennung und Fahrzeugdaten stammen von der KI (Claude) und sind Schätzungen, keine Datenbankwerte. Unsichere Werte sind mit „unbekannt“ oder „wahrscheinlich“ markiert. Deine Garage liegt lokal auf deinem Gerät.</div>
 ${cars.length?`<button class="btn d" style="margin-top:14px" data-act="wipe">Garage komplett leeren</button>`:""}</div>`}
const kv=(k,v,u)=>`<div class="kv"><span>${k}</span><em class="${v==null||v===""?"u":""}">${v==null||v===""?"unbekannt":esc(v)}</em></div>`;
function det(c){const lo=(c.conf??1)<.6;return`<div class="v"><button class="btn" data-act="back">‹ Zurück</button>
 <div class="img fade" style="margin:14px 0"><img src="${c.img}" alt=""></div>
 <div class="row sp"><div><h1>${esc(nm(c))}</h1><small style="color:var(--mu)">${esc(c.gen||"")} ${esc(c.years?"· "+c.years:"")}</small></div><span class="badge ${lo?"w":""}">${lo?"unsicher":"Treffer "+Math.round((c.conf||0)*100)+"%"}</span></div>
 ${lo&&c.cands&&c.cands.length?`<h2>Mögliche Modelle</h2>${c.cands.map((x,i)=>`<button class="btn cand" data-act="cand" data-i="${i}">${esc(x.brand)} ${esc(x.model)} ${esc(x.generation||"")} · ${Math.round((x.confidence||0)*100)}%</button>`).join("")}`:""}
 <div class="g3 fade" style="margin:16px 0"><div class="hl"><b>${fmt(c.ps)}</b><small>PS</small></div><div class="hl"><b>${fmt(c.vmax)}</b><small>km/h max</small></div><div class="hl"><b>${c.acc??"–"}</b><small>0–100 s</small></div></div>
 ${c.rarity?`<h2>Seltenheit</h2><div class="card"><div class="row sp"><b style="font-size:26px;color:var(--or)">${c.rarity}<small style="color:var(--mu);font-size:14px"> / 10</small></b><span class="badge">${rl(c.rarity)}</span></div><div style="height:8px;border-radius:9px;background:var(--card2);margin:10px 0"><div style="height:100%;width:${c.rarity*10}%;border-radius:9px;background:linear-gradient(90deg,#ff8a2a,var(--or));box-shadow:0 0 12px #ff6a00"></div></div>${kv("Gebaute Stückzahl",c.produced?fmt(c.produced):null)}<small style="color:var(--mu)">${esc(c.rarityWhy||"")}</small></div>`:""}
 <h2>Grundinfos</h2><div class="card">${kv("Marke",c.brand)}${kv("Modell",c.model)}${kv("Generation",c.gen)}${kv("Bauzeitraum",c.years)}${kv("Klasse",c.cls)}${kv("Karosserie",c.body)}</div>
 <h2>Technik</h2><div class="card">${kv("Motor",c.engine)}${kv("Hubraum",c.disp)}${kv("Leistung",c.ps?fmt(c.ps)+" PS / "+fmt(c.kw||c.ps*.7355)+" kW":null)}${kv("Drehmoment",c.nm?fmt(c.nm)+" Nm":null)}${kv("Antrieb",c.drive)}${kv("Getriebe",c.gear)}${kv("Kraftstoff",c.fuel)}${kv("Gewicht",c.weight?fmt(c.weight)+" kg":null)}${kv("Verbrauch",c.cons)}</div>
 <h2>Preise</h2><div class="card">${kv(c.inProduction?"Aktueller Listenpreis (ab)":"Ursprünglicher Neupreis",c.priceNew?eur(c.priceNew):null)}${kv("Gebraucht (Markt DE, geschätzt)",c.priceUsed?eur(c.priceUsed):null)}${c.priceUsedMin&&c.priceUsedMax?kv("Übliche Spanne",eur(c.priceUsedMin)+" – "+eur(c.priceUsedMax)):""}<small style="color:var(--mu)">${esc(c.priceNote||"KI-Schätzung, orientiert an mobile.de und AutoScout24. Kein Live-Preis.")}</small></div>
 ${(c.features||[]).length?`<h2>Besonderheiten</h2><div class="card">${c.features.map(f=>`<div class="kv"><em style="text-align:left">• ${esc(f)}</em></div>`).join("")}</div>`:""}
 ${(c.facts||[]).length?`<h2>Wusstest du?</h2><div class="card">${c.facts.map(f=>`<div class="kv"><em style="text-align:left">${esc(f)}</em></div>`).join("")}</div>`:""}
 <div class="row" style="margin-top:18px;flex-wrap:wrap"><button class="btn p" data-act="fav">${c.fav?"★ Favorit":"☆ Favorit"}</button><button class="btn" data-act="share">Teilen</button><button class="btn d" data-act="del">Löschen</button></div></div>`}
function compare(){const[a,b]=cmp.map(id=>cars.find(c=>c.id===id)),row=(k,f,hi)=>{const x=f(a),y=f(b),w=x==null||y==null?0:(hi?x>y:x<y)?1:x==y?0:2;return`<div class="kv"><em style="color:${w==1?"var(--or)":"#fff"}">${x??"–"}</em><span>${k}</span><em style="color:${w==2?"var(--or)":"#fff"}">${y??"–"}</em></div>`};
 return`<div class="v"><button class="btn" data-act="back">‹ Zurück</button><h1 style="margin:14px 0">Vergleich</h1><div class="g2"><div class="img"><img src="${a.img}"></div><div class="img"><img src="${b.img}"></div></div>
 <div class="g2" style="margin:10px 0"><b>${esc(nm(a))}</b><b style="text-align:right">${esc(nm(b))}</b></div><div class="card">${row("PS",c=>c.ps,1)}${row("Drehmoment Nm",c=>c.nm,1)}${row("0–100 s",c=>c.acc,0)}${row("km/h max",c=>c.vmax,1)}${row("Gewicht kg",c=>c.weight,0)}${row("Wert €",c=>c.priceUsed,1)}</div></div>`}
function scanV(){const s=scanSt;return`<div class="v"><h1>Auto scannen</h1>
 ${s.phase=="idle"?`<p style="color:var(--mu);margin:8px 0 18px">Fotografiere ein Auto möglichst von der Seite oder schräg vorne.</p><div class="img" style="aspect-ratio:4/3;margin-bottom:16px;color:var(--mu)">◎</div><button class="scanbtn" style="margin:0 0 12px" data-act="cam">📷 Kamera öffnen</button><button class="btn" style="width:100%" data-act="gal">Aus Galerie wählen</button>`:""}
 ${s.phase=="run"||s.phase=="err"?`<div class="scan ${s.phase=="err"?"done":""}" style="min-height:120px">${s.url?`<img src="${s.url}" alt="">`:""}</div><div class="step" id="st">${esc(s.msg)}</div>`:""}
 ${s.phase=="err"?`<div class="card err">${esc(s.err)}</div><button class="btn p" style="margin-top:14px;width:100%" data-act="again">Erneut versuchen</button>`:""}</div>`}
function render(){nav();const c=detail&&cars.find(x=>x.id===detail);app.innerHTML=cmpMode&&cmp.length==2&&tab=="cmp"?compare():c?det(c):tab=="home"?home():tab=="scan"?scanV():tab=="garage"?garage():profile();const so=$("#so");if(so)so.value=F.sort;scrollTo(0,0)}
/* ---------- Scan-Ablauf ---------- */
async function runScan(file){tab="scan";detail=null;
 try{scanSt={phase:"run",url:"",msg:"Bild wird vorbereitet …"};render();const P=await prep(file);scanSt.url=P.url;render();
  const step=m=>{scanSt.msg=m;const e=$("#st");if(e)e.textContent=m};
  step("KI erkennt das Fahrzeug …");const r=await analyze(P.big);
  if(!r||!r.isCar)throw new Error("Auf dem Foto wurde kein Auto erkannt. Versuche es mit mehr Abstand und besserem Licht.");
  let img=P.url;if(LS.get("cx_cut")=="1"){step("Auto wird freigestellt …");try{img=cutout(P.canvas,r.bbox)}catch(e){}}
  const car={...r,id:"c"+Date.now(),ts:Date.now(),img,conf:r.confidence,cands:r.candidates||[],fav:false};delete car.candidates;delete car.bbox;delete car.isCar;delete car.confidence;
  step("Fertig!");await Store.put(car);cars.unshift(car);scanSt={phase:"idle"};detail=car.id;render()
 }catch(e){const m=e&&(e.code=="not_granted"?"Zugriff auf die KI wurde nicht erlaubt.":e.code=="rate_limited"?"Zu viele Anfragen. Bitte kurz warten.":e.message)||"Unbekannter Fehler.";scanSt={...scanSt,phase:"err",err:m,msg:"Scan fehlgeschlagen"};render()}}
async function saveFile(blob,name){try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name=="AbortError")return}
 const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function exportData(){try{await saveFile(new Blob([JSON.stringify({app:"carvex",v:1,cars})],{type:"application/json"}),"carvex-garage-"+new Date().toISOString().slice(0,10)+".json")}catch(e){}}
async function pickCand(i){const c=cars.find(x=>x.id===detail),x=c.cands[i];app.insertAdjacentHTML("afterbegin",'<div class="step">Lade Daten …</div>');
 try{const r=await byHint(`${x.brand} ${x.model} ${x.generation||""}`);Object.assign(c,r,{conf:x.confidence>.6?x.confidence:.65,cands:[],id:c.id,ts:c.ts,img:c.img,fav:c.fav});delete c.candidates;delete c.bbox;delete c.isCar;delete c.confidence;await Store.put(c)}catch(e){alert("Daten konnten nicht geladen werden.")}render()}
async function share(c){try{const cv=document.createElement("canvas");cv.width=1080;cv.height=1350;const g=cv.getContext("2d");g.fillStyle="#0A0A0A";g.fillRect(0,0,1080,1350);
 const gr=g.createRadialGradient(540,640,50,540,640,600);gr.addColorStop(0,"#5a2a0a");gr.addColorStop(1,"#0A0A0A");g.fillStyle=gr;g.fillRect(0,0,1080,1350);
 const im=await loadImg(c.img),w=960,h=w*im.height/im.width;g.drawImage(im,0,0,im.width,Math.min(im.height,im.width*.73),60,80,960,700);
 g.fillStyle="#fff";g.font="800 72px Arial";g.fillText(nm(c).slice(0,26),60,860);g.fillStyle="#9a9a9a";g.font="36px Arial";g.fillText(`${c.gen||""} ${c.years||""}`,60,915);
 [[fmt(c.ps),"PS"],[fmt(c.vmax),"km/h"],[c.acc??"–","0–100 s"]].forEach(([v,l],i)=>{g.fillStyle="#ff6a00";g.font="800 84px Arial";g.fillText(v,60+i*340,1090);g.fillStyle="#9a9a9a";g.font="34px Arial";g.fillText(l,60+i*340,1140)});
 g.fillStyle="#fff";g.font="800 40px Arial";g.fillText("CAR",60,1290);g.fillStyle="#ff6a00";g.fillText("VEX",160,1290);
 const blob=await new Promise(r=>cv.toBlob(r,"image/png"));await saveFile(blob,"carvex-"+nm(c).replace(/\W+/g,"-")+".png")}catch(e){}}
/* ---------- Events ---------- */
document.addEventListener("click",async e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,c=cars.find(x=>x.id===detail);
 if(a=="tab"){tab=t.dataset.v;detail=null;if(tab=="scan")scanSt={phase:"idle"};cmpMode=false;cmp=[];render()}
 else if(a=="open"){const id=t.dataset.id;if(cmpMode){cmp=cmp.includes(id)?cmp.filter(x=>x!=id):[...cmp,id].slice(-2);if(cmp.length==2){tab="cmp";render()}else render()}else{detail=id;render()}}
 else if(a=="back"){detail=null;if(tab=="cmp"){tab="garage";cmpMode=false;cmp=[]}render()}
 else if(a=="cmpmode"){cmpMode=!cmpMode;cmp=[];render()}
 else if(a=="cam")$("#cam").click();else if(a=="gal")$("#gal").click();else if(a=="again"){scanSt={phase:"idle"};render()}
 else if(a=="fav"){c.fav=!c.fav;await Store.put(c);render()}
 else if(a=="del"){if(confirm("Dieses Auto aus der Garage löschen?")){await Store.del(c.id);cars=cars.filter(x=>x!==c);detail=null;render()}}
 else if(a=="share")share(c);else if(a=="exp")exportData();else if(a=="imp")$("#imp").click();else if(a=="cand")pickCand(+t.dataset.i);
 else if(a=="wipe"&&confirm("Wirklich alle Autos löschen?")){for(const x of cars)await Store.del(x.id);cars=[];render()}});
app.addEventListener("input",e=>{if(e.target.id=="q"){F.q=e.target.value;const p=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(p,p)}});
app.addEventListener("change",e=>{if(e.target.id=="api"){LS.set("cx_api",e.target.value.trim());return}if(e.target.id=="co"){LS.set("cx_cut",e.target.checked?"1":"0");return}if(e.target.id=="so"){F.sort=e.target.value;render();$("#so").value=F.sort}if(e.target.id=="cl"){F.cls=e.target.value;render()}});
["cam","gal"].forEach(id=>$("#"+id).addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)runScan(f)}));
$("#imp").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!="carvex"||!Array.isArray(j.cars))throw 0;let n=0;for(const c of j.cars)if(c&&c.id&&c.img&&!cars.some(x=>x.id===c.id)){await Store.put(c);cars.push(c);n++}cars.sort((a,b)=>b.ts-a.ts);alert(n+" Autos importiert.")}catch(x){alert("Diese Datei ist kein gültiges CARVEX-Backup.")}render()});
(async()=>{await Store.open();cars=(await Store.all()).sort((a,b)=>b.ts-a.ts);render()})();
</script></body></html>
